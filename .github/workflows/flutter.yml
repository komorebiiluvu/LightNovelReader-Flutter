name: Flutter foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Quality
            runner: ubuntu-24.04
          - check: Android debug
            runner: ubuntu-24.04
          - check: Android storage smoke
            runner: ubuntu-24.04
          - check: Windows debug
            runner: windows-2025
          - check: iOS debug unsigned
            runner: macos-15
    steps:
      - name: Check out application
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android JDK
        if: matrix.check == 'Android debug' || matrix.check == 'Android storage smoke'
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Flutter SDK
        run: |
          $flutterSdk = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $flutterSdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $flutterSdk 'bin')

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Use configured Android JDK
        if: matrix.check == 'Android debug' || matrix.check == 'Android storage smoke'
        run: flutter config --jdk-dir="$env:JAVA_HOME"

      - name: Enable Windows desktop
        if: matrix.check == 'Windows debug'
        run: flutter config --enable-windows-desktop

      - name: Record runner toolchains
        run: flutter doctor -v

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        if: matrix.check == 'Quality'
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Drift generation and schema snapshots
        if: matrix.check == 'Quality'
        run: ./tool/verify_generated.ps1

      - name: Analyze
        if: matrix.check == 'Quality'
        run: flutter analyze --no-pub

      - name: Unit and widget tests
        if: matrix.check == 'Quality'
        run: flutter test --no-pub

      - name: Build Android debug APK
        if: matrix.check == 'Android debug'
        run: flutter build apk --debug --no-pub

      - name: Build Windows debug
        if: matrix.check == 'Windows debug'
        run: flutter build windows --debug --no-pub

      - name: Windows packaged storage smoke
        if: matrix.check == 'Windows debug'
        run: flutter test integration_test/storage_smoke_test.dart -d windows --no-pub

      - name: Enable Android emulator acceleration
        if: matrix.check == 'Android storage smoke'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Diagnose Android runner disk space
        if: matrix.check == 'Android storage smoke'
        shell: bash
        run: |
          set -euo pipefail
          df -h
          du -sh "$RUNNER_TEMP" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Android packaged storage smoke
        if: matrix.check == 'Android storage smoke'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: '1024M'
          disable-animations: true
          script: flutter test integration_test/storage_smoke_test.dart -d emulator-5554 --no-pub

      - name: Build iOS debug without signing
        if: matrix.check == 'iOS debug unsigned'
        run: flutter build ios --debug --no-codesign --no-pub

      - name: Boot available iOS simulator
        if: matrix.check == 'iOS debug unsigned'
        run: |
          $inventory = xcrun simctl list devices available --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = $inventory.devices.PSObject.Properties | Where-Object { $_.Name -like '*iOS*' } | Sort-Object Name -Descending | Select-Object -First 1
          $device = $runtime.Value | Where-Object { $_.isAvailable -and $_.name -like 'iPhone*' } | Select-Object -First 1
          if (-not $device) { throw 'No available iPhone simulator; storage smoke cannot run.' }
          if ($device.state -ne 'Booted') {
            xcrun simctl boot $device.udid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          xcrun simctl bootstatus $device.udid -b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "IOS_SMOKE_DEVICE=$($device.udid)"

      - name: iOS simulator packaged storage smoke
        if: matrix.check == 'iOS debug unsigned'
        run: flutter test integration_test/storage_smoke_test.dart -d "$env:IOS_SMOKE_DEVICE" --no-pub
